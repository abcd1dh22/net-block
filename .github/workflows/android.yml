name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # tag push হলে GitHub Release বানাতে লাগে

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="1.0.${{ github.run_number }}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V (code ${{ github.run_number }})"

      - name: Prepare signing keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret সেট করা নেই। APK debug key দিয়ে সাইন হবে। প্রোডাকশনের জন্য README-র signing ধাপ অনুসরণ করুন।"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -n 15

      - name: APK info
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)" || true
          fi
          ls -lh "$APK"

      - name: Collect artifacts
        run: |
          NAME="TimeBlocker-v${{ steps.ver.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          (cd dist && sha256sum "${NAME}.apk" > "${NAME}.apk.sha256")
          {
            echo "### 📦 APK ready: \`${NAME}.apk\`"
            echo ""
            echo "- Version: ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})"
            echo "- Signing: ${{ steps.ks.outputs.signed == 'true' && 'release keystore ✅' || 'debug key ⚠️ (production secrets যোগ করুন)' }}"
            echo "- Size: $(du -h "dist/${NAME}.apk" | cut -f1)"
            echo "- SHA-256: \`$(cut -d' ' -f1 "dist/${NAME}.apk.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeBlocker-v${{ steps.ver.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Upload R8 mapping (crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-v${{ steps.ver.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Lint (non-blocking)
        continue-on-error: true
        run: gradle lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
