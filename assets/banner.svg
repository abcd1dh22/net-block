<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Net Block">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0057FF"/>
      <stop offset="1" stop-color="#00C9A7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#g)"/>

  <g transform="translate(230,160)">
    <circle r="90" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0">
      <animate attributeName="r" values="90;150" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="90" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0">
      <animate attributeName="r" values="90;150" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite"/>
      <path fill="#fff" d="M0,-92 L72,-64 L72,-8 C72,46 38,76 0,96 C-38,76 -72,46 -72,-8 L-72,-64 Z"/>
      <g fill="none" stroke="#0A84D6" stroke-width="8" stroke-linecap="round">
        <path d="M-46,-6 A66 66 0 0 1 46,-6"/>
        <path d="M-32,12 A45 45 0 0 1 32,12"/>
        <path d="M-17,29 A24 24 0 0 1 17,29"/>
      </g>
      <circle cx="0" cy="46" r="6" fill="#0A84D6"/>
      <line x1="-48" y1="-38" x2="48" y2="52" stroke="#FF6B6B" stroke-width="9" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="430" y="150" font-size="84" font-weight="800">Net Block
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>
    <text x="434" y="205" font-size="30" opacity="0.92">Cut the internet for any app. No root. No ads.
      <animate attributeName="opacity" values="0;0.92" dur="1.4s" fill="freeze"/>
    </text>
  </g>
</svg>
